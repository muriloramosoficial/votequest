    <meta name="description" content="VoteQuest — uma enquete independente. Escolha seu lado e participe via Pix." />
    <title>VoteQuest — Prove seu voto</title>

    <!-- Google Analytics 4. G-H2Z6VQ07WQ is a public measurement id, safe to ship in HTML. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-H2Z6VQ07WQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { window.dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-H2Z6VQ07WQ', { send_page_view: false });
      // /admin holds the administrative token in memory and a /xxxxxxxx receipt link encodes
      // the reference code, so neither path is ever sent to Analytics.
      var isReceiptPath = /^\/[23456789A-HJ-NP-Z]{8}$/i.test(window.location.pathname.replace(/\/+$/, ''));
      if (window.location.pathname !== '/admin' && !isReceiptPath) {
        gtag('event', 'page_view', {
          page_path: window.location.pathname,
          page_location: window.location.href,
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
